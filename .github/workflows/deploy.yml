name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # GitHub repository name is automatically available via github.repository
  # We convert it to lowercase for the docker image name.

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Client Docker
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LC }}/client

      - name: Build and push Client Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LC }}/client:latest
          labels: ${{ steps.meta-client.outputs.labels }}

      - name: Extract metadata for Server Docker
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LC }}/server

      - name: Build and push Server Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LC }}/server:latest
          labels: ${{ steps.meta-server.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-images
    
    steps:
      - name: Deploy to Ubuntu Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_REPO
          # Provide the commands the server needs to run.
          # It assumes your server has a folder matching the repo name or you just have a 'docker-compose.yml' in the home directory.
          # To make it robust, we can just echo the compose file or assume you've copied it to the server manually.
          # Better yet, the server can download the raw docker-compose.yml directly from the repo.
          script: |
            echo "Logging into GHCR..."
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Create a directory for the app if it doesn't exist
            mkdir -p ~/online-exam-portal
            cd ~/online-exam-portal
            
            # Download the latest docker-compose.yml securely from the main branch
            curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                 -H "Accept: application/vnd.github.v3.raw" \
                 -O -L https://api.github.com/repos/$GITHUB_REPO/contents/docker-compose.yml
            
            # Ensure the server directory and .env file exist
            mkdir -p server
            touch server/.env
            
            # Pull the latest built images and start them
            export GITHUB_REPOSITORY=$(echo $GITHUB_REPO | tr '[:upper:]' '[:lower:]')
            docker compose pull
            docker compose up -d
            
            # Clean up old unused images
            docker image prune -af
